description: |
  Rockchip RK3568 dual-mode PCIe 3.0 x2 controller in endpoint mode.

  The register ranges include the controller, CRU and PCIe 3.0 x2 PHY
  resources needed by the endpoint initialization sequence.

compatible: "rockchip,rk3568-pcie-ep"

include: base.yaml

properties:
  reg:
    required: true

  reg-names:
    required: true
    description: |
      Must contain "dbi", "client", "map", "cru", "pmu_grf",
      "pipe_grf", "phy_grf", and "phy".

  rockchip,configure-m0-pins:
    type: boolean
    description: |
      Configure GPIO0_A6, GPIO0_C5, and GPIO0_C6 for the PCIe3x2 M0
      CLKREQ#, WAKE#, and PERST# functions.

  rockchip,external-refclk:
    type: boolean
    description: Use the 100 MHz differential reference clock input from the host

  num-ob-windows:
    type: int
    default: 1
    description: |
      Number of outbound iATU regions used to divide the outbound memory
      aperture. Valid values are powers of two from 1 through 16.

  vendor-id:
    type: int
    description: PCI vendor ID programmed before link training

  device-id:
    type: int
    description: PCI device ID programmed before link training

  class-revision:
    type: int
    description: Combined PCI class code and revision ID register value

  subsystem-vendor-id:
    type: int
    description: PCI subsystem vendor ID programmed before link training

  subsystem-id:
    type: int
    description: PCI subsystem ID programmed before link training
