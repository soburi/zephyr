description: |
  QEMU PCI endpoint controller (EPC) device.

  The device is provided by the out-of-tree QEMU PCI endpoint controller
  emulation and shows up on the guest PCI bus with vendor ID 0x1b36 and
  device ID 0x0013. It forwards endpoint operations performed by the guest
  to a PCI endpoint device model on another QEMU instance.

compatible: "qemu,pci-epc"

include: [pcie-epc.yaml, pcie-device.yaml]

properties:
  doorbell-bar:
    type: int
    default: 0
    description: |
      BAR of the endpoint function that holds the doorbell range. The
      default is the first BAR.

  doorbell-offset:
    type: int
    description: |
      Offset of the doorbell range in the BAR. The device model interrupts
      the endpoint when the PCI host writes the range, wherever it lies, so
      set it to the register in which the endpoint function expects its
      notifications. The node needs an interrupts property then. Without
      this property the endpoint controller has no doorbell.

  doorbell-width:
    type: int
    default: 4
    enum: [1, 2, 4]
    description: |
      Width in bytes of the doorbell range. The default is a 32-bit
      register.
