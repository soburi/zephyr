description: LiteX timer

compatible: "litex,timer0"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clock-frequency:
    type: int
    description: |
      Frequency the timer counts at, in Hz. This is the LiteX sys_clk, which is
      not necessarily the CPU clock.
