description: |
  VHost controller exposing a VIRTIO PCI device through a PCI endpoint
  function.

  The controller adds one endpoint function to the PCI endpoint controller
  (EPC) referenced by the epc property. The function implements the legacy
  VIRTIO PCI register layout in BAR 0, so the PCI host on the other side of
  the link drives it with its regular virtio-pci driver.

  When the endpoint controller services BARs in software, the controller
  handles each host access to the register window as it is made, on a
  notification of the endpoint controller or, without one, by polling for
  accesses.

  Otherwise the register window is plain memory to the host: accesses are
  not trapped, so the controller polls it. Registers that are banked by the
  queue selector cannot be emulated this way. When the platform wires a
  doorbell of the endpoint controller to the queue notify register, queue
  notifications are taken from it instead.

  The device has a single virtqueue.

compatible: "zephyr,vhost-pci-epf"

include: base.yaml

properties:
  epc:
    type: phandle
    required: true
    description: |
      PCI endpoint controller the endpoint function is added to.

  device-id:
    type: int
    required: true
    description: |
      Virtio device ID value, as defined by the VIRTIO Specification, used to
      identify the type of device implemented by this instance. It must have
      a transitional PCI device ID.

  queue-size-max:
    type: int
    required: true
    description: |
      Number of entries of the virtqueue. It must be a power of two. With
      the legacy register layout the driver cannot select a smaller size.

  max-buffers:
    type: int
    default: 16
    description: |
      Maximum number of driver buffers mapped at the same time, summed over
      all outstanding requests. Each mapped buffer occupies one outbound
      address window of the endpoint controller, and one more window is used
      for the virtqueue itself. The default fits one request made of a full
      16 entry descriptor chain.

  poll-period-ms:
    type: int
    default: 10
    description: |
      Period, in milliseconds, at which the register window is polled for
      driver activity. The default trades request latency against the load
      of an idle device.

  queue-notify-doorbell:
    type: int
    description: |
      Number of the endpoint controller doorbell that the platform wired to
      the queue notify register of the function: the 16-bit register at
      offset 0x10 of BAR 0. The function cannot tell where the doorbell
      lies, so the integration, which configures the endpoint controller,
      must match it with the register layout described above. Without this
      property queue notifications are found by polling.

  doorbell-poll-period-ms:
    type: int
    default: 500
    description: |
      Period, in milliseconds, at which the controller runs while the
      endpoint controller notifies it of the driver activity: once the
      driver runs the device and queue notifications arrive through the
      doorbell given by queue-notify-doorbell, or whenever the endpoint
      controller notifies the host accesses to the register window. Little
      or nothing is left to be detected by polling then, so the default
      favors a low idle load.

  stack-size:
    type: int
    default: 4096
    description: |
      Stack size (in bytes) for the instance-specific work queue thread. The
      default fits the controller and a backend with a shallow call depth.

  priority:
    type: int
    default: 0
    description: |
      Priority for the instance-specific work queue thread. The default is
      the highest preemptible priority.

  config-data:
    type: uint8-array
    description: |
      Device-specific configuration, as described for the device type in the
      VIRTIO Specification.
