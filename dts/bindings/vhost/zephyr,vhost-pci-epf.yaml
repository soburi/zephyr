description: |
  VHost controller exposing a VIRTIO PCI device through a PCI endpoint
  function.

  The controller adds one endpoint function to the PCI endpoint controller
  (EPC) referenced by the epc property. The PCI host on the other side of the
  link drives it with its regular virtio-pci driver. The function raises the
  INTx interrupt; it has no MSI-X capability.

  By default the function implements the modern VIRTIO PCI interface: VIRTIO
  capabilities that point at the configuration structures in BAR 0. It needs
  an endpoint controller that services BARs in software, since the common
  configuration banks registers by selectors, and that can add capabilities.
  The controller handles each host access as it is made, on a notification of
  the endpoint controller or, without one, by polling for accesses.

  With the legacy property, the function implements the legacy VIRTIO PCI
  register layout in BAR 0 and a single virtqueue. On an endpoint controller
  that does not service BARs in software, the register window is plain memory
  to the host, so the controller polls it; when the platform wires a doorbell
  of the endpoint controller to the queue notify register, queue
  notifications are taken from it instead.

compatible: "zephyr,vhost-pci-epf"

include: base.yaml

properties:
  epc:
    type: phandle
    required: true
    description: |
      PCI endpoint controller the endpoint function is added to.

  legacy:
    type: boolean
    description: |
      Implement the legacy VIRTIO PCI interface instead of the modern one.

  device-id:
    type: int
    required: true
    description: |
      Virtio device ID value, as defined by the VIRTIO Specification, used to
      identify the type of device implemented by this instance. With the
      legacy property, it must have a transitional PCI device ID.

  num-queues:
    type: int
    default: 1
    description: |
      Number of virtqueues of the device, at most 32. The legacy interface
      has one.

  queue-size-max:
    type: int
    required: true
    description: |
      Maximum number of entries of a virtqueue. It must be a power of two.
      The driver of the modern interface can select a smaller size; with the
      legacy interface the virtqueues have this size.

  max-buffers:
    type: int
    default: 16
    description: |
      Maximum number of driver buffers mapped at the same time, summed over
      all outstanding requests. Each mapped buffer occupies one outbound
      address window of the endpoint controller, and each virtqueue uses
      three more for its rings. The default fits one request made of a full
      16 entry descriptor chain.

  poll-period-ms:
    type: int
    default: 10
    description: |
      Period, in milliseconds, at which the register window is polled for
      driver activity. The default trades request latency against the load
      of an idle device.

  queue-notify-doorbell:
    type: int
    description: |
      Number of the endpoint controller doorbell that the platform wired to
      the queue notify register of the legacy interface: the 16-bit register
      at offset 0x10 of BAR 0. The function cannot tell where the doorbell
      lies, so the integration, which configures the endpoint controller,
      must match it with the register layout described above. Without this
      property queue notifications are found by polling.

  doorbell-poll-period-ms:
    type: int
    default: 500
    description: |
      Period, in milliseconds, at which the controller runs while the
      endpoint controller notifies it of the driver activity: once the
      driver runs the device and queue notifications arrive through the
      doorbell given by queue-notify-doorbell, or whenever the endpoint
      controller notifies the host accesses to the register window. Little
      or nothing is left to be detected by polling then, so the default
      favors a low idle load.

  stack-size:
    type: int
    default: 4096
    description: |
      Stack size (in bytes) for the instance-specific work queue thread. The
      default fits the controller and a backend with a shallow call depth.

  priority:
    type: int
    default: 0
    description: |
      Priority for the instance-specific work queue thread. The default is
      the highest preemptible priority.

  config-data:
    type: uint8-array
    description: |
      Device-specific configuration, as described for the device type in the
      VIRTIO Specification.
