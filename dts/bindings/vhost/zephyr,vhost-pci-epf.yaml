description: |
  VHost controller exposing a VIRTIO PCI device through a PCI endpoint
  function.

  The controller adds one endpoint function to the PCI endpoint controller
  (EPC) referenced by the epc property. The function implements the VIRTIO
  PCI interface ("Virtio Over PCI Bus" in the VIRTIO specification): VIRTIO
  capabilities that point at the configuration structures in BAR 0. The PCI
  host on the other side of the link drives it with its regular virtio-pci
  driver. The function raises the INTx interrupt; it has no MSI-X
  capability.

  The common configuration banks registers by selectors, so the controller
  serves each host access to BAR 0 in software. It needs an endpoint
  controller that services BARs in software and can add capabilities. It
  handles the accesses on a notification of the endpoint controller or,
  without one, by polling for them.

compatible: "zephyr,vhost-pci-epf"

include: base.yaml

properties:
  epc:
    type: phandle
    required: true
    description: |
      PCI endpoint controller the endpoint function is added to.

  device-id:
    type: int
    required: true
    description: |
      Virtio device ID value, as defined by the VIRTIO Specification, used to
      identify the type of device implemented by this instance.

  num-queues:
    type: int
    default: 1
    description: |
      Number of virtqueues of the device, at most 32.

  queue-size-max:
    type: int
    required: true
    description: |
      Maximum number of entries of a virtqueue. It must be a power of two.
      The driver can select a smaller size.

  max-buffers:
    type: int
    default: 16
    description: |
      Maximum number of driver buffers mapped at the same time, summed over
      all outstanding requests. Each mapped buffer occupies one outbound
      address window of the endpoint controller, and each virtqueue uses
      three more for its rings. The default fits one request made of a full
      16 entry descriptor chain.

  poll-period-ms:
    type: int
    default: 1
    description: |
      Period, in milliseconds, at which the controller polls for host
      accesses to BAR 0 when the endpoint controller does not notify them.
      Each access waits for the poll, so the default favors latency.

  stack-size:
    type: int
    default: 4096
    description: |
      Stack size (in bytes) for the instance-specific work queue thread. The
      default fits the controller and a backend with a shallow call depth.

  priority:
    type: int
    default: 0
    description: |
      Priority for the instance-specific work queue thread. The default is
      the highest preemptible priority.

  config-data:
    type: uint8-array
    description: |
      Device-specific configuration, as described for the device type in the
      VIRTIO Specification.
