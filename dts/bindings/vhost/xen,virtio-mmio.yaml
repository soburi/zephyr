description: Xen VHost MMIO device for VIRTIO backends

compatible: "xen,vhost-mmio"

include: base.yaml

properties:
  base:
    type: int
    required: true
    description: |
      Guest physical base address of the virtio MMIO register region used by
      this Xen vhost-mmio device.

  num-queues:
    type: int
    required: true
    description: |
      Number of virtqueues exposed by this device instance.

  queue-size-max:
    type: int
    required: true
    description: |
      Maximum number of entries supported in each virtqueue for this device.

  buffer-size:
    type: int
    required: true
    description: |
      Fixed data buffer capacity in bytes for each descriptor-chain head.
      The driver allocates this capacity, rounded up to Xen pages, at
      initialization. The sum of buffer lengths in a request must not exceed
      this value. Each buffer consumes whole mapping pages, including its
      page offset, so fragmented requests can exhaust the mapping capacity
      before reaching this byte limit. Requests exceeding either capacity
      are rejected. Virtqueue ring mappings are allocated separately.

  device-id:
    type: int
    required: true
    description: |
      Virtio device ID value, as defined by the VIRTIO Specification, used to
      identify the type of device implemented by this vhost-mmio instance.

  vendor-id:
    type: int
    default: 0
    description: |
      Virtio vendor ID value reported by the device. A value of 0 selects the
      implementation-defined or Xen-provided default vendor ID.

  device-features:
    type: int
    default: 0
    description: |
      Device-specific feature bits 0 through 31 advertised in addition to the
      transport feature bits supplied by the driver.

  stack-size:
    type: int
    description: |
      Stack size (in bytes) for the instance-specific work_q thread.

  priority:
    type: int
    description: |
      Priority for the instance-specific work_q thread.

  config-data:
    type: uint8-array
    description: |
     Configuration at 0x100+ in the '4.2.2 MMIO Device Register Layout' section
     of the VIRTIO Specification.
