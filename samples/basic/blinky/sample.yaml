sample:
  name: Blinky Sample
tests:
  sample.basic.blinky:
    tags:
      - LED
      - gpio
    filter: dt_enabled_alias_with_parent_compat("led0", "gpio-leds")
    depends_on: gpio
    harness: led
    integration_platforms:
      - frdm_k64f
  sample.basic.blinky.xen_domd_rpi5:
    tags:
      - LED
      - gpio
      - xen
    build_only: true
    extra_args: SNIPPET=xen-domd
    platform_allow:
      - rpi_5/bcm2712
