description: File storage backend for the vhost virtio-blk sample

compatible: "zephyr,vhost-blk-file"

include: base.yaml

properties:
  file-path:
    type: string
    required: true
    description: Absolute path on an already mounted Zephyr file system.

  sector-count:
    type: int
    required: true
    description: Number of 512-byte sectors exposed to the guest.
