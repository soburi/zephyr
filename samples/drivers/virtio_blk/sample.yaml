sample:
  description: Read and write a VirtIO block device through the Disk Access API
  name: VirtIO block disk
common:
  tags:
    - disk
    - drivers
    - virtio
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "VirtIO block disk VIRTIOBLK0: [0-9]+ sectors of [0-9]+ bytes"
      - "Wrote and verified sector [0-9]+"
      - "Original sector restored"
      - "VirtIO block sample completed successfully"
tests:
  sample.drivers.virtio_blk.pci:
    platform_allow:
      - qemu_x86_64
    integration_platforms:
      - qemu_x86_64
  sample.drivers.virtio_blk.mmio:
    platform_allow:
      - qemu_cortex_a53
    integration_platforms:
      - qemu_cortex_a53
  sample.drivers.virtio_blk.xenvm:
    build_only: true
    platform_allow:
      - xenvm/xenvm/gicv3
  sample.drivers.virtio_blk.sparrowhawk_xen:
    build_only: true
    extra_args: SNIPPET=xen-guest
    platform_allow:
      - sparrowhawk_rcar_v4h/r8a779g0/a76
